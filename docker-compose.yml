# Local-development docker-compose: just Postgres for now.
#
# Why minimal? Chapter 1 only needs the database. The full deploy compose (with
# the app container, bind-mounted markdown directory, etc.) lives in the spec
# at docs/PROJECTPROJECT.md and we'll grow toward it across later chapters.
#
# Usage:
#   docker compose up -d           # start postgres in the background
#   docker compose down            # stop and remove the container
#   docker compose down -v         # stop AND wipe the volume (resets the DB)
#
# The DATABASE_URL the backend uses is read from `.env` (see `.env.example`).
# It points at this container at localhost:5432.

# Pin the compose project name.
#
# Compose otherwise derives it from the working directory's basename, which
# differs per git worktree (`project-project` in the main checkout, `t3code-*`
# in each worktree). The `container_name:` keys below are global across compose
# projects, so a second checkout would see no container in *its* project, try
# to create one, and collide:
#   Conflict. The container name "/projectproject-postgres" is already in use
# Pinning the name means every checkout shares one project, one container set,
# and one set of volumes. The value matches the existing
# `project-project_*` volume prefix so current dev data is preserved.
name: project-project

services:
  postgres:
    image: postgres:16-alpine
    container_name: projectproject-postgres
    environment:
      POSTGRES_USER: projectproject
      POSTGRES_PASSWORD: projectproject_dev
      POSTGRES_DB: projectproject
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "projectproject"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: projectproject-minio
    labels:
      - dev.orbstack.http-port=9001
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: projectproject
      MINIO_ROOT_PASSWORD: projectproject_dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
