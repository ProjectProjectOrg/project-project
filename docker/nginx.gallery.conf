server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Assets are precompressed in Dockerfile.gallery; dynamic gzip covers the rest.
  gzip_static on;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/markdown text/plain;

  charset utf-8;
  charset_types text/markdown text/plain;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Each page also exists as Markdown (and /llms.txt indexes them), so AI
  # tools can read the docs. A `types` block here would replace nginx's
  # whole MIME table, so the type is set per location instead.
  location ~ \.md$ {
    default_type text/markdown;
    types { }
    try_files $uri =404;
  }

  # Pages are routed in the browser, so a path that isn't a file gets the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
