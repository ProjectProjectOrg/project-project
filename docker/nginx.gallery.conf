# A request that asks for Markdown (Accept: text/markdown) gets a page's .md.
map $http_accept $gallery_md {
  default "";
  "~text/markdown" ".md";
}

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # nginx's MIME table has no Markdown; this adds to it.
  include /etc/nginx/mime.types;
  types {
    text/markdown md;
  }
  charset utf-8;
  charset_types text/markdown text/plain;

  # Assets are precompressed in Dockerfile.gallery; dynamic gzip covers the rest.
  gzip_static on;
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/markdown text/plain;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location ~ \.(md|txt)$ {
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  location = / {
    add_header Cache-Control "no-cache";
    add_header Vary Accept;
    try_files /index$gallery_md /index.html;
  }

  # Each page is built as its own .html with its content in it, for tools
  # that don't run scripts. Any other path gets the app, which routes in the
  # browser.
  location / {
    add_header Cache-Control "no-cache";
    add_header Vary Accept;
    try_files $uri$gallery_md $uri $uri.html $uri/ /index.html;
  }
}
