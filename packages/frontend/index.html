<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProjectProject</title>
    <link rel="icon" type="image/svg+xml" href="/icon/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/icon/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icon/apple-touch-icon.png" />
    <link rel="manifest" href="/icon/site.webmanifest" />
    <script>
      // Set the theme class before React mounts to avoid a light->dark flash.
      // Mirrors the logic in src/hooks/useTheme.ts.
      ;(function () {
        try {
          var stored = localStorage.getItem("projectproject:theme")
          var pref =
            stored === "light" || stored === "dark" || stored === "system"
              ? stored
              : "system"
          var resolved =
            pref === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : pref
          if (resolved === "dark")
            document.documentElement.classList.add("dark")
        } catch (_) {}
      })()
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
