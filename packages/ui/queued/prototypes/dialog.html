<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Dialog directions</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;550&display=swap"
      rel="stylesheet"
    />
    <style>
      .light {
        --bg: oklch(1 0 0);
        --fg: oklch(0.145 0 0);
        --muted: oklch(0.556 0 0);
        --popover: oklch(1 0 0);
        --border: oklch(0.922 0 0);
        --s1: oklch(0.955 0 0);
        --s2: oklch(0.977 0 0);
        --s3: oklch(1 0 0);
        --s4: oklch(1 0 0);
        --s5: oklch(1 0 0);
        --hover: rgb(0 0 0/0.04);
        --active: rgb(0 0 0/0.07);
        --tint: oklch(0 0 0/8%);
        --ring: oklch(0.708 0 0);
        --focus: oklch(0.693 0.161 265.2);
        --destructive: oklch(0.577 0.245 27.325);
        --dfg: oklch(0.985 0 0);
        --line: oklch(0 0 0/5%);
        --scrim: rgb(0 0 0/0.15);
        --scrim2: rgb(0 0 0/0.2);
      }
      .dark {
        --bg: oklch(0.145 0 0);
        --fg: oklch(0.985 0 0);
        --muted: oklch(0.708 0 0);
        --popover: oklch(0.205 0 0);
        --border: oklch(1 0 0/10%);
        --s1: oklch(0.205 0 0);
        --s2: oklch(0.235 0 0);
        --s3: oklch(0.264 0 0);
        --s4: oklch(0.293 0 0);
        --s5: oklch(0.321 0 0);
        --hover: rgb(255 255 255/0.04);
        --active: rgb(255 255 255/0.1);
        --tint: oklch(1 0 0/14%);
        --ring: oklch(0.556 0 0);
        --focus: oklch(0.693 0.161 265.2);
        --destructive: oklch(0.704 0.191 22.216);
        --dfg: oklch(0.985 0 0);
        --line: oklch(1 0 0/6%);
        --scrim: rgb(0 0 0/0.4);
        --scrim2: rgb(0 0 0/0.5);
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: Geist, system-ui, sans-serif;
      }
      .wrap {
        display: grid;
        gap: 12px;
      }
      .theme {
        background: var(--bg);
        color: var(--fg);
        padding: 24px;
        border-radius: 16px;
      }
      h1 {
        font-size: 15px;
        font-weight: 550;
        margin: 0 0 4px;
      }
      .sub {
        font-size: 13px;
        color: var(--muted);
        margin: 0 0 20px;
        line-height: 1.5;
      }
      .dir {
        background: var(--s2);
        border-radius: 20px;
        corner-shape: squircle;
        padding: 6px;
        margin-bottom: 12px;
      }
      .cap {
        display: flex;
        gap: 8px;
        align-items: baseline;
        padding: 8px 10px 10px;
        flex-wrap: wrap;
      }
      .cap b {
        font-size: 13px;
        font-weight: 550;
      }
      .cap span {
        font-size: 12px;
        color: var(--muted);
      }
      .stage {
        position: relative;
        height: 420px;
        overflow: hidden;
        background: var(--bg);
        border-radius: 14px;
        corner-shape: squircle;
      }
      /* fake page behind */
      .page {
        padding: 20px;
        display: grid;
        gap: 10px;
      }
      .page .bar {
        height: 12px;
        border-radius: 6px;
        background: var(--s1);
      }
      .page .bar.w1 {
        width: 40%;
      }
      .page .bar.w2 {
        width: 70%;
      }
      .page .bar.w3 {
        width: 55%;
      }
      .reopen {
        position: absolute;
        left: 20px;
        bottom: 16px;
        z-index: 0;
      }
      svg {
        width: 14px;
        height: 14px;
        fill: none;
        stroke: currentColor;
        stroke-width: 1.75;
        stroke-linecap: round;
        stroke-linejoin: round;
        flex: none;
      }
      /* buttons (app Button md) */
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 32px;
        padding: 0 16px;
        border: 0;
        border-radius: 20px;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
        outline: none;
        transition:
          background-color 0.15s,
          box-shadow 0.15s,
          scale 0.1s;
      }
      .btn:hover {
        transition-duration: 0s;
      }
      .btn:active {
        scale: 0.97;
      }
      .btn:focus-visible {
        box-shadow: 0 0 0 2px var(--focus);
      }
      .btn.tertiary {
        background: var(--s3);
        color: var(--fg);
        box-shadow: inset 0 0 0 1px var(--border);
      }
      .btn.tertiary:hover {
        background-image: linear-gradient(var(--hover), var(--hover));
      }
      .btn.destructive {
        background: var(--destructive);
        color: var(--dfg);
      }
      .btn.destructive:hover {
        background: color-mix(in oklch, var(--destructive) 90%, transparent);
      }
      .btn.ghosticon {
        width: 32px;
        padding: 0;
        background: transparent;
        color: var(--muted);
      }
      .btn.ghosticon:hover {
        background: var(--hover);
        color: var(--fg);
      }
      .btn.secondary {
        background: var(--tint);
        color: var(--fg);
      }
      /* dialog skeleton */
      .scrim {
        position: absolute;
        inset: 0;
        background: var(--scrim);
        z-index: 1;
      }
      .panel {
        position: absolute;
        left: 0;
        right: 0;
        top: 56px;
        margin: 0 auto;
        width: min(400px, calc(100% - 32px));
        z-index: 2;
        color: var(--fg);
        outline: none;
      }
      .title {
        font-size: 16px;
        line-height: 22px;
        font-weight: 550;
        margin: 0;
      }
      .desc {
        font-size: 13px;
        line-height: 20px;
        color: var(--muted);
        margin: 0;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .field .l {
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
      }
      .select {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 32px;
        padding: 0 10px 0 12px;
        border-radius: 10px;
        font-size: 13px;
        background: var(--s3);
        box-shadow: inset 0 0 0 1px var(--border);
      }
      .select .chev {
        margin-left: auto;
        color: var(--muted);
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 3px;
        background: oklch(0.7 0.16 15);
      }
      .note {
        font-size: 12px;
        line-height: 16px;
        color: var(--muted);
        margin: 0;
      }
      .footer {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
      }
      [data-open="false"] .scrim {
        opacity: 0;
        pointer-events: none;
      }
      [data-open="false"] .panel {
        opacity: 0;
        pointer-events: none;
      }

      /* ---------- A current ---------- */
      .A .scrim {
        transition: opacity 0.15s ease;
      }
      .A .panel {
        background: var(--popover);
        border: 1px solid color-mix(in oklch, var(--border) 60%, transparent);
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.12);
        transform-origin: top;
        transition:
          opacity 0.15s ease,
          transform 0.15s ease;
      }
      .dark .A .panel {
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.6);
      }
      .A [data-open="false"] .panel {
        transform: scale(0.98);
      }
      .A .hdr {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 16px;
      }
      .A .footer {
        margin-top: 16px;
      }
      .A .body {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: -0px;
      }

      /* ---------- B squircle on the ladder + spring ---------- */
      .B .scrim {
        background: var(--scrim2);
        transition: opacity 0.18s ease;
      }
      .B .panel {
        background: var(--popover);
        border-radius: 28px;
        corner-shape: squircle;
        padding: 24px;
        box-shadow: inset 0 0 0 1px var(--line);
        transition:
          opacity 0.16s ease,
          transform 0.26s cubic-bezier(0.34, 1.3, 0.5, 1);
      }
      .dark .B .panel {
        background: var(--s3);
      }
      .B [data-open="false"] .panel {
        transform: scale(0.96);
        transition:
          opacity 0.12s ease-in,
          transform 0.12s ease-in;
      }
      .B .x {
        position: absolute;
        top: 12px;
        right: 12px;
        border-radius: 16px;
        corner-shape: squircle;
      }
      .B .hdr {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-bottom: 18px;
        padding-right: 28px;
      }
      .B .select {
        border-radius: 14px;
        corner-shape: squircle;
      }
      .dark .B .select {
        background: var(--s5);
      }
      .B .footer {
        margin-top: 24px;
      }
      .B .btn {
        corner-shape: squircle;
      }

      /* ---------- C footer tray ---------- */
      .C .scrim {
        transition: opacity 0.2s ease;
      }
      .C .panel {
        background: var(--popover);
        border-radius: 24px;
        corner-shape: squircle;
        padding: 6px;
        box-shadow: inset 0 0 0 1px var(--line);
        transition:
          opacity 0.18s ease,
          transform 0.28s cubic-bezier(0.34, 1.3, 0.5, 1);
      }
      .dark .C .panel {
        background: var(--s4);
      }
      .C [data-open="false"] .panel {
        transform: translateY(12px);
        transition:
          opacity 0.12s ease-in,
          transform 0.12s ease-in;
      }
      .C .inner {
        padding: 16px 16px 18px;
      }
      .C .hdr {
        display: flex;
        align-items: flex-start;
        gap: 8px;
        margin-bottom: 16px;
      }
      .C .hdr .t {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .C .x {
        margin: -6px -6px 0 0;
        width: 28px;
        height: 28px;
        border-radius: 14px;
        corner-shape: squircle;
      }
      .C .select {
        border-radius: 12px;
        corner-shape: squircle;
      }
      .dark .C .select {
        background: var(--s5);
      }
      .C .tray {
        background: var(--s1);
        border-radius: 18px;
        corner-shape: squircle;
        padding: 6px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }
      .dark .C .tray {
        background: var(--s2);
      }
      .C .tray .btn {
        border-radius: 12px;
        corner-shape: squircle;
        height: 36px;
      }
      .C .tray .btn.tertiary {
        background: transparent;
        box-shadow: none;
        color: var(--fg);
      }
      .C .tray .btn.tertiary:hover {
        background: var(--hover);
      }

      /* ---------- D header bar + blur-in ---------- */
      .D .scrim {
        background: var(--scrim);
        backdrop-filter: blur(3px);
        -webkit-backdrop-filter: blur(3px);
        transition: opacity 0.2s ease;
      }
      .D .panel {
        background: var(--popover);
        border-radius: 20px;
        corner-shape: squircle;
        box-shadow: inset 0 0 0 1px var(--line);
        overflow: hidden;
        transition:
          opacity 0.2s ease,
          transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
          filter 0.2s ease;
      }
      .dark .D .panel {
        background: var(--s3);
      }
      .D [data-open="false"] .panel {
        transform: scale(0.99);
        filter: blur(4px);
        transition:
          opacity 0.12s ease-in,
          transform 0.12s ease-in,
          filter 0.12s ease-in;
      }
      .D .hdr {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 48px;
        padding: 0 8px 0 20px;
        border-bottom: 1px solid var(--line);
      }
      .D .hdr .title {
        flex: 1;
        font-size: 15px;
      }
      .D .x {
        width: 32px;
        height: 32px;
        border-radius: 12px;
        corner-shape: squircle;
      }
      .D .body {
        padding: 16px 20px 20px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .D .select {
        border-radius: 12px;
        corner-shape: squircle;
      }
      .dark .D .select {
        background: var(--s5);
      }
      .D .footer {
        border-top: 1px solid var(--line);
        padding: 12px 12px 12px 20px;
        justify-content: space-between;
      }
      .D .footer .hint {
        font-size: 12px;
        color: var(--muted);
      }
      .D .footer .hint kbd {
        font: inherit;
        font-size: 11px;
        padding: 1px 5px;
        border-radius: 5px;
        background: var(--tint);
        color: var(--fg);
      }
      .D .footer .btns {
        display: flex;
        gap: 8px;
      }
      .D .btn {
        corner-shape: squircle;
      }

      @media (prefers-reduced-motion: reduce) {
        .panel {
          transform: none !important;
          filter: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap" id="root"></div>
    <script>
      const I = {
        x: '<svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg>',
        chev: '<svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>',
        open: '<svg viewBox="0 0 24 24"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>'
      }
      const DIRS = [
        {
          k: "A",
          t: "A · Current",
          n: "rounded-xl (12px), 60% border plus a 48px drop shadow, black/15 scrim, 150ms fade + zoom from 98% at the top edge. No close button in the app: no call site passes closeLabel. Affects DeleteTypeDialog, FlagTicketDialog, NewSectionDialog, SendFeedbackDialog, CreateTicket/CreateSprint (lg, p-0)."
        },
        {
          k: "B",
          t: "B · Squircle on the surface ladder",
          n: "28px squircle, no shadow: surface-3 in dark plus a 5–6% hairline, slightly deeper scrim. Springs in from 96% (260ms, light overshoot), exits fast. Close × at a concentric 16px radius, 12px in."
        },
        {
          k: "C",
          t: "C · Inset footer tray",
          n: "24px squircle with 6px padding; the actions live in a recessed tray (surface-1, radius 18 = 24 − 6), split equal width. Rises 12px on a spring. × sits in the title row."
        },
        {
          k: "D",
          t: "D · Header bar + blur-in",
          n: "20px squircle with full-bleed header and footer bars split by hairlines; × in the header bar, an Esc hint left of the actions. Scrim blurs the page 3px; panel un-blurs from 4px (200ms, no overshoot)."
        }
      ]
      const body = (k) => `
 <div class="field"><span class="l">Move its 12 tickets to</span><div class="select" role="button" tabindex="0" aria-label="Replacement type"><span class="dot"></span>Task<span class="chev">${I.chev}</span></div></div>
 <p class="note">Archived tickets move too. This can’t be undone.</p>`
      const actions = `<button class="btn tertiary" data-close>Cancel</button><button class="btn destructive" data-close>Delete and move</button>`
      const panel = {
        A: () =>
          `<div class="hdr"><h2 class="title">Delete type “Bug”?</h2><p class="desc">12 tickets in Web app use this type.</p></div><div class="body">${body()}</div><div class="footer">${actions}</div>`,
        B: () =>
          `<button class="btn ghosticon x" aria-label="Close" data-close>${I.x}</button><div class="hdr"><h2 class="title">Delete type “Bug”?</h2><p class="desc">12 tickets in Web app use this type.</p></div><div class="body" style="display:flex;flex-direction:column;gap:8px">${body()}</div><div class="footer">${actions}</div>`,
        C: () =>
          `<div class="inner"><div class="hdr"><div class="t"><h2 class="title">Delete type “Bug”?</h2><p class="desc">12 tickets in Web app use this type.</p></div><button class="btn ghosticon x" aria-label="Close" data-close>${I.x}</button></div><div style="display:flex;flex-direction:column;gap:8px">${body()}</div></div><div class="tray">${actions}</div>`,
        D: () =>
          `<div class="hdr"><h2 class="title">Delete type “Bug”?</h2><button class="btn ghosticon x" aria-label="Close" data-close>${I.x}</button></div><div class="body"><p class="desc">12 tickets in Web app use this type.</p><div style="display:flex;flex-direction:column;gap:8px">${body()}</div></div><div class="footer"><span class="hint"><kbd>Esc</kbd> to cancel</span><span class="btns">${actions}</span></div>`
      }
      const block = (mode) =>
        `<div class="theme ${mode}"><h1>Dialog · ${mode === "light" ? "Light" : "Dark"}</h1><p class="sub">Each stage starts open. Close with Cancel, ×, Esc or a click on the scrim, then “Open dialog” to replay the enter motion. Content is the Delete type dialog (sm, 400px).</p>` +
        DIRS.map(
          (d) =>
            `<div class="dir ${d.k}"><div class="cap"><b>${d.t}</b><span>${d.n}</span></div><div class="stage" data-open="true"><div class="page"><div class="bar w1"></div><div class="bar w2"></div><div class="bar w3"></div><div class="bar w2"></div><div class="bar w1"></div></div><button class="btn secondary reopen" data-openbtn>${I.open}Open dialog</button><div class="scrim" data-close></div><div class="panel" role="dialog" aria-modal="true" aria-label="Delete type Bug" tabindex="-1">${panel[d.k]()}</div></div></div>`
        ).join("") +
        "</div>"
      document.getElementById("root").innerHTML = block("light") + block("dark")
      document.querySelectorAll(".stage").forEach((s) => {
        const set = (o) => {
          s.dataset.open = o
          if (o) requestAnimationFrame(() => s.querySelector(".panel").focus())
          else s.querySelector("[data-openbtn]").focus()
        }
        s.querySelectorAll("[data-close]").forEach((b) =>
          b.addEventListener("click", () => set(false))
        )
        s.querySelector("[data-openbtn]").addEventListener("click", () =>
          set(true)
        )
        s.addEventListener("keydown", (e) => {
          if (e.key === "Escape" && s.dataset.open === "true") {
            e.preventDefault()
            set(false)
          }
        })
      })
    </script>
  </body>
</html>
