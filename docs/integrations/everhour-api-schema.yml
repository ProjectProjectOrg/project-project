  ClientBudget:
    type: object
    required:
      - type
      - budget
      - period
    properties:
      type:
        type: string
        enum:
          - money
          - time
          - costs
        description: Budget Type
      budget:
        type: number
        example: 100000
        description: Budget value in cents (for money) or seconds (for time)
      period:
        type: string
        enum:
          - general
          - monthly
          - weekly
          - daily
        description: Budget periodicity (overall, monthly, weekly, daily)
      appliedFrom:
        type: string
        description: Start budget from (available only for non-recurrent budgets)
      disallowOverbudget:
        type: boolean
        description: Disallow overbudget
      excludeUnbillableTime:
        type: boolean
        description: Exclude non-billable time
      excludeExpenses:
        type: boolean
        description: Exclude expenses
      threshold:
        type: number
        description: 'Email admins when threshold reached. Threshold is percentage: 1 - 100.'
      progress:
        type: number
        description: >-
          [readonly] Current budget usage in cents (for money) or seconds (for
          time)
  Project:
    type: object
    required:
      - id
      - name
    properties:
      id:
        type: string
        example: as:1234567890
      name:
        type: string
        example: Project Name
      workspaceId:
        type: string
        example: as:9876543219
      workspaceName:
        type: string
        example: Workspace Name
      client:
        type: number
        example: 123456
        description: Client ID
      type:
        type: string
        enum:
          - board
          - list
        description: Project Type
      favorite:
        type: boolean
      users:
        type: array
        items: {}
        description: List of assigned user IDs
      billing:
        $ref: '#/definitions/ProjectBillingBilling'
        description: Billing type
      rate:
        $ref: '#/definitions/ProjectBillingRate'
        description: Rates configuration for billing or budget progress
      budget:
        $ref: '#/definitions/ProjectBillingBudget'
        description: Budget
  ProjectRequest:
    type: object
    required:
      - name
      - type
    properties:
      name:
        type: string
        example: Project Name
      type:
        type: string
        enum:
          - board
          - list
        description: Project Type
      users:
        type: array
        items: {}
        description: List of assigned user IDs
  ProjectBillingBilling:
    type: object
    required:
      - type
    properties:
      type:
        type: string
        enum:
          - non_billable
          - hourly
          - fixed_fee
        description: Project Type
      fee:
        type: number
        example: 10000
        description: >-
          Project fixed fee in cents (e.g. 10000 means $100.00). Available only
          for `fixed_fee` type.
  ProjectBillingRate:
    type: object
    required:
      - type
    properties:
      type:
        type: string
        enum:
          - project_rate
          - user_rate
        description: Project Type
      rate:
        type: number
        example: 10000
        description: >-
          Flat-rate in cents (e.g. 10000 means $100.00). Available only for
          `project_rate` type.
      userRateOverrides:
        type: object
        required:
          - '1304'
          - '1543'
        properties:
          '1304':
            type: number
            example: 10000
            description: User ID=1304 has billable rate $100.00/hrs (10000 cents)
          '1543':
            type: number
            example: 5000
            description: User ID=1543 has billable rate $50.00/hrs (5000 cents)
        description: Override user rates. Available only for `user_rate` type.
  ProjectBillingBudget:
    type: object
    required:
      - type
      - budget
      - period
    properties:
      type:
        type: string
        enum:
          - money
          - time
          - costs
        description: Budget Type
      budget:
        type: number
        example: 100000
        description: Budget value in cents (for money) or seconds (for time)
      progress:
        type: number
        description: >-
          [readonly] Current budget usage in cents (for money) or seconds (for
          time)
      timeProgress:
        type: number
        description: '[readonly] Budget progress belongs to time tracking'
      expenseProgress:
        type: number
        description: '[readonly] Budget progress belongs to expeses'
      period:
        type: string
        enum:
          - general
          - monthly
          - weekly
          - daily
        description: Budget periodicity (overall, monthly, weekly, daily)
      appliedFrom:
        type: string
        description: Start budget from (available only for non-recurrent budgets)
      disallowOverbudget:
        type: boolean
        description: Disallow overbudget
      excludeUnbillableTime:
        type: boolean
        description: Exclude non-billable time
      excludeExpenses:
        type: boolean
        description: Exclude expenses
      showToUsers:
        type: boolean
        description: Set true if all team members should see budget and its progress
      threshold:
        type: number
        description: 'Email admins when threshold reached. Threshold is percentage: 1 - 100.'
  ProjectBilling:
    type: object
    properties:
      billing:
