swagger: '2.0'
info:
  title: Everhour API
  version: ''
  description: >-
    **The Everhour API is currently in BETA**, which means that some API calls
    can be slightly adjusted in near future.

    Meanwhile, we do our best to push any BC changes in separate API versions
    and protect your integrations from unexpected crashes.


    For any suggestions, feedback and issues please send a message to chat
    inside your Everhour account or email us at ask@everhour.com.


    ## Getting Started


    Everhour API is a RESTful interface, providing programmatic access to much
    of the data in the system.

    It provides predictable URLs to access resources, and uses built-in HTTP
    features to receive commands and return responses.

    This makes it easy to communicate with from a wide variety of environments,
    from command-line utilities to gadgets to the browser URL bar itself.


    The API accepts only JSON content in requests and returns JSON content in
    all of its responses, including errors.

    Only the UTF-8 character encoding is supported for both requests and
    responses.


    ## Authentication


    Currently, we provide only a plain authorization by an API key.

    You can find an API key in [your
    profile](https://app.everhour.com/#/account/profile) at the bottom of the
    page.


    All your requests should include **X-Api-Key** header with valid API key.


    For example:


    `X-Api-Key: abcd-efgh-1234567-7890ab-cdefgh12`


    ## Versioning


    Optionally, you can use specific API version with **X-Accept-Version**
    request header.

    We will stick you with the most recent version (1.2) if there are no such
    header in the request.


    For example:


    `X-Accept-Version: 1.2`


    ## Rate Limiting


    The limit is currently around 20 requests per 10 seconds per API key, but
    this is not guaranteed: it may vary with server load, and we may change it
    in the future.

    You will receive a **429** HTTP response if you exceed the rate limit.
    **Retry-After** response header will specify the number of seconds after the
    user can make another request.


    Please contact us first, if you need perform a batch of API requests.

    Maybe we can provide you a more convenient way to retrieve the data.
