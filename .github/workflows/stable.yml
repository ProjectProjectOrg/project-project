name: stable

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Explicit commit to release instead of the latest soaked nightly (hotfixes)."
        type: string
        required: false

concurrency:
  group: release-stable
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      source_tag: ${{ steps.resolve.outputs.source_tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        uses: actions/github-script@v8
        env:
          SOAK_HOURS: ${{ vars.STABLE_MIN_SOAK_HOURS || '2' }}
          REF: ${{ inputs.ref }}
        with:
          script: |
            const { resolveStable } = require("./.github/scripts/release.cjs");
            await resolveStable({
              github, context, core,
              soakHours: Number(process.env.SOAK_HOURS),
              ref: process.env.REF,
            });

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote as stable
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/projectproject"
          for name in app web; do
            revision=$(docker buildx imagetools inspect "$prefix-$name:$SOURCE_TAG" --format '{{json .Image}}' \
              | jq -r '.config.Labels["org.opencontainers.image.revision"] // empty')
            if [ "$revision" != "$SHA" ]; then
              echo "::error::$prefix-$name:$SOURCE_TAG was built from '${revision:-unknown}', not $SHA."
              exit 1
            fi
          done
          docker buildx build --push --provenance=false \
            --build-arg SOURCE_IMAGE="$prefix-app:$SOURCE_TAG" \
            --build-arg APP_VERSION="$TAG" \
            -t "$prefix-app:$TAG" \
            -t "$prefix-app:stable" \
            -t "$prefix-app:latest" - <<'DOCKERFILE'
          ARG SOURCE_IMAGE
          FROM $SOURCE_IMAGE
          ARG APP_VERSION
          ENV APP_VERSION=$APP_VERSION
          LABEL org.opencontainers.image.version=$APP_VERSION
          DOCKERFILE
          docker buildx imagetools create \
            -t "$prefix-web:$TAG" \
            -t "$prefix-web:stable" \
            -t "$prefix-web:latest" \
            "$prefix-web:$SOURCE_TAG"

      - name: Reuse the nightly's pp CLI
        id: cli
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release download "$SOURCE_TAG" --dir dist/cli \
            --pattern 'pp-*.gz' --pattern SHA256SUMS --pattern install.sh \
              --pattern 'THIRD_PARTY_LICENSE-*' 2>/dev/null; then
            echo "reused=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$SOURCE_TAG has no pp binaries; building them from $SHA."
            rm -rf dist/cli
            echo "reused=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the released commit
        if: steps.cli.outputs.reused == 'false'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Bun
        if: steps.cli.outputs.reused == 'false'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build the pp CLI
        if: steps.cli.outputs.reused == 'false'
        run: |
          bun install --frozen-lockfile
          sh .github/scripts/build-cli.sh "$TAG" dist/cli

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=(--target "$SHA" --latest --generate-notes --title "ProjectProject $TAG")
          [ -n "$PREVIOUS_TAG" ] && args+=(--notes-start-tag "$PREVIOUS_TAG")
          gh release create "$TAG" "${args[@]}" dist/cli/*
