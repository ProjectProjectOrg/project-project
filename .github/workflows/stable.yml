name: stable

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Explicit commit to release instead of the latest soaked nightly (hotfixes)."
        type: string
        required: false

concurrency:
  group: release-stable
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      source_tag: ${{ steps.resolve.outputs.source_tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        uses: actions/github-script@v7
        env:
          SOAK_HOURS: ${{ vars.STABLE_MIN_SOAK_HOURS || '2' }}
          REF: ${{ inputs.ref }}
        with:
          script: |
            const { resolveStable } = require("./.github/scripts/release.cjs");
            await resolveStable({
              github, context, core,
              soakHours: Number(process.env.SOAK_HOURS),
              ref: process.env.REF,
            });

  publish:
    needs: resolve
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
      TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_TAG: ${{ needs.resolve.outputs.source_tag }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag as stable
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/projectproject"
          for name in app web; do
            docker buildx imagetools inspect "$prefix-$name:$SOURCE_TAG" >/dev/null
          done
          for name in app web; do
            docker buildx imagetools create \
              -t "$prefix-$name:$TAG" \
              -t "$prefix-$name:stable" \
              -t "$prefix-$name:latest" \
              "$prefix-$name:$SOURCE_TAG"
          done

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=(--target "$SHA" --latest --generate-notes --title "ProjectProject $TAG")
          [ -n "$PREVIOUS_TAG" ] && args+=(--notes-start-tag "$PREVIOUS_TAG")
          gh release create "$TAG" "${args[@]}"
