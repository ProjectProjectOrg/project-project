name: nightly

on:
  schedule:
    - cron: "8 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the gap has not passed
        type: boolean
        default: false

concurrency:
  group: release-nightly
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      publish: ${{ steps.resolve.outputs.publish }}
      sha: ${{ steps.resolve.outputs.sha }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      previous_tag: ${{ steps.resolve.outputs.previous_tag }}
    steps:
      - uses: actions/checkout@v5
      - id: resolve
        uses: actions/github-script@v8
        env:
          GAP_HOURS: ${{ vars.NIGHTLY_MIN_GAP_HOURS || '2' }}
          FORCE: ${{ inputs.force || 'false' }}
        with:
          script: |
            const { resolveNightly } = require("./.github/scripts/release.cjs");
            await resolveNightly({
              github, context, core,
              gapHours: Number(process.env.GAP_HOURS),
              force: process.env.FORCE === "true",
            });

  publish:
    needs: resolve
    if: needs.resolve.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      SHA: ${{ needs.resolve.outputs.sha }}
      SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
      VERSION: ${{ needs.resolve.outputs.version }}
      TAG: ${{ needs.resolve.outputs.tag }}
      PREVIOUS_TAG: ${{ needs.resolve.outputs.previous_tag }}
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote CI images as nightly
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/projectproject"
          for name in app web; do
            src="$prefix-$name:sha-$SHORT_SHA"
            if ! docker buildx imagetools inspect "$src" >/dev/null 2>&1; then
              echo "::notice::$src is not published yet (CI still running or red). Skipping."
              exit 0
            fi
          done
          docker buildx build --push --provenance=false \
            --build-arg SOURCE_IMAGE="$prefix-app:sha-$SHORT_SHA" \
            --build-arg APP_VERSION="$TAG" \
            -t "$prefix-app:nightly" \
            -t "$prefix-app:$TAG" - <<'DOCKERFILE'
          ARG SOURCE_IMAGE
          FROM $SOURCE_IMAGE
          ARG APP_VERSION
          ENV APP_VERSION=$APP_VERSION
          LABEL org.opencontainers.image.version=$APP_VERSION
          DOCKERFILE
          docker buildx imagetools create \
            -t "$prefix-web:nightly" \
            -t "$prefix-web:$TAG" \
            "$prefix-web:sha-$SHORT_SHA"
          echo "retagged=true" >> "$GITHUB_ENV"

      - name: Check out the released commit
        if: env.retagged == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}

      - name: Set up Bun
        if: env.retagged == 'true'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Build the pp CLI
        if: env.retagged == 'true'
        run: |
          bun install --frozen-lockfile
          sh .github/scripts/build-cli.sh "$TAG" dist/cli

      - name: Publish prerelease
        if: env.retagged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          args=(--target "$SHA" --prerelease --generate-notes --title "ProjectProject nightly $VERSION ($SHORT_SHA)")
          [ -n "$PREVIOUS_TAG" ] && args+=(--notes-start-tag "$PREVIOUS_TAG")
          gh release create "$TAG" "${args[@]}" dist/cli/*
