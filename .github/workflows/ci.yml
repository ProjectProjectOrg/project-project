name: ci

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

# A new push to a PR cancels its stale run; main and merge queue runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AFFECTED: ${{ github.event_name == 'pull_request' && '--affected' || '' }}
  TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha || '' }}

jobs:
  checks:
    name: Format, lint and migrations
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: |
          failed=""
          bun run fmt:check || failed="$failed format"
          bun run lint || failed="$failed lint"
          bun run --filter @pp/db db:check || failed="$failed migrations"
          if [ -n "$failed" ]; then echo "::error::Failed:$failed"; exit 1; fi

  typecheck:
    name: Typecheck
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck $AFFECTED

  build:
    name: Build
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build $AFFECTED

      - if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

  test:
    name: Test (${{ matrix.shard }}/4)
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none

      - name: Start background setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sudo systemctl start --no-block postgresql
          docker pull --quiet postgres:16-alpine > /dev/null 2>&1 &
          (.github/scripts/download-test-timings.sh > "$RUNNER_TEMP/timings.log" 2>&1; echo $? > "$RUNNER_TEMP/timings.code" && mv "$RUNNER_TEMP/timings.code" "$RUNNER_TEMP/timings.exit") > /dev/null 2>&1 &

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - id: messages
        uses: actions/cache@v4
        with:
          path: apps/frontend/src/paraglide
          key: messages-${{ hashFiles('apps/frontend/project.inlang/settings.json', 'apps/frontend/messages/**', 'bun.lock') }}

      - name: Compile messages
        if: steps.messages.outputs.cache-hit != 'true'
        run: bun run --filter @pp/frontend paraglide:compile

      - name: Wait for background setup
        run: |
          until [ -f "$RUNNER_TEMP/timings.exit" ]; do sleep 0.1; done
          cat "$RUNNER_TEMP/timings.log"
          [ "$(cat "$RUNNER_TEMP/timings.exit")" = 0 ]
          until pg_isready -q -h 127.0.0.1; do sleep 0.1; done
          sudo -u postgres psql -qc "alter user postgres password 'postgres'"

      - name: Test
        run: bun run test --shard=${{ matrix.shard }}/4
        env:
          PROJECTPROJECT_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres

      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: test-timings-${{ matrix.shard }}
          path: .cache/test-timings-measured.json
          retention-days: 30
          include-hidden-files: true

  images:
    name: Push images (${{ matrix.target.name }})
    needs: [checks, typecheck, build, test]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: app, dockerfile: docker/Dockerfile.backend }
          - { name: web, dockerfile: docker/Dockerfile.frontend }
          - { name: gallery, dockerfile: docker/Dockerfile.gallery }
    steps:
      - uses: actions/checkout@v4

      - if: matrix.target.name == 'gallery'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - if: matrix.target.name == 'gallery'
        name: Build gallery
        run: |
          bun install --frozen-lockfile
          bun run --cwd packages/ui build-gallery

      - if: matrix.target.name == 'web'
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: apps/frontend/dist

      - uses: docker/setup-buildx-action@v3
        with:
          cleanup: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/projectproject-${{ matrix.target.name }}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          build-args: APP_VERSION=sha-${{ github.sha }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:sha-${{ steps.img.outputs.short }}
            ${{ steps.img.outputs.name }}:main
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,scope=${{ matrix.target.name }},mode=max
