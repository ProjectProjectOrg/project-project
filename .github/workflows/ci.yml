name: ci

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels its stale run; main runs are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: effect-v4-test
          POSTGRES_DB: projectproject_effect_v4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Migrate test database
        run: bun run test:migrate
        env:
          DATABASE_URL: postgres://postgres:effect-v4-test@127.0.0.1:5432/projectproject_effect_v4_test

      - name: Test
        run: bun run test:all
        env:
          BETTER_AUTH_SECRET: isolated-effect-v4-oauth-compatibility-test-secret
          PROJECTPROJECT_TEST_DATABASE_URL: postgres://postgres:effect-v4-test@127.0.0.1:5432/projectproject_effect_v4_test

      - name: Build
        run: bun run build

  images:
    name: Push images (${{ matrix.target.name }})
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: app, dockerfile: docker/Dockerfile.backend }
          - { name: web, dockerfile: docker/Dockerfile.frontend }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/projectproject-${{ matrix.target.name }}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.img.outputs.name }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.target.dockerfile }}
          build-args: APP_VERSION=sha-${{ github.sha }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:sha-${{ steps.img.outputs.short }}
            ${{ steps.img.outputs.name }}:main
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.target.name }}
          cache-to: type=gha,scope=${{ matrix.target.name }},mode=max
