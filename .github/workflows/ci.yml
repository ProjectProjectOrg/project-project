name: ci

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: effect-v4-test
          POSTGRES_DB: projectproject_effect_v4_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      - name: Check
        run: bun run check

      - name: Migrate test database
        run: bun run test:migrate
        env:
          DATABASE_URL: postgres://postgres:effect-v4-test@127.0.0.1:5432/projectproject_effect_v4_test

      - name: Test
        run: bun run test:all
        env:
          BETTER_AUTH_SECRET: isolated-effect-v4-oauth-compatibility-test-secret
          PROJECTPROJECT_TEST_DATABASE_URL: postgres://postgres:effect-v4-test@127.0.0.1:5432/projectproject_effect_v4_test

      - name: Build
        run: bun run build
